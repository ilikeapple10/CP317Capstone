<header class="topbar">
  <a class="brand" routerLink="/">shop</a>
  <nav class="nav">
    @if (auth.isLoggedIn()) {
      <a class="nav-link" routerLink="/seller">Sell</a>
      <button type="button" class="nav-link">Orders</button>
      <button type="button" class="nav-link" (click)="signOut()">Sign out</button>
    } @else {
      <a class="nav-link" routerLink="/login">Sign in</a>
    }
    <a class="nav-link" routerLink="/cart">
      Cart <span class="cart-count">{{ cart.count() }}</span>
    </a>
  </nav>
</header>
